  - name: lego
    status: exclude
    repos: [{owner: cthiebaud, repo: lego}]
    note: "Archived, not a fork. Unknown nature -- hobby project?"
  - name: burbain
    status: exclude
    repos: [{owner: cthiebaud, repo: burbain}]
    note: "Archived, not a fork. Unknown nature."
  - name: next-netlify-starter
    status: exclude
    repos: [{owner: cthiebaud, repo: next-netlify-starter}]
    note: "Archived, boilerplate starter template (not a fork, but name says it all). Recommend: exclude."
  - name: nuxt3-starter
    status: exclude
    repos: [{owner: cthiebaud, repo: nuxt3-starter}]
    note: "Archived, boilerplate starter template. Recommend: exclude."

  # Orgs that look like sites/projects built for *other people*, not
  # Christophe's own hobby projects -- but he coded them, so worth asking.
  - name: carolethomas
    status: exclude
    repos: [{owner: carolethomas, repo: carolethomas.github.io}]
    note: "Looks like a site built for someone else (Carole Thomas). In scope as Christophe's dev work, or out as 'not his project'?"
  - name: mugnierandthiebaud
    status: exclude
    repos:
      - {owner: mugnierandthiebaud, repo: mugnierandthiebaud.github.io}
      - {owner: mugnierandthiebaud, repo: docker-lilypond}
    note: "Joint-name org (site + a forked docker-lilypond). docker-lilypond is a fork -- likely exclude that one regardless. Site itself: in or out?"
  - name: eric-mugnier
    status: exclude
    repos:
      - {owner: eric-mugnier, repo: tete-de-veau-ravigote}
      - {owner: eric-mugnier, repo: eric-mugnier.github.io}
    note: "Looks like a site/project for someone else (Eric Mugnier). In scope or out?"
