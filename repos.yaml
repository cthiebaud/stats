# Repo inventory & grouping for the AI-dev-efficiency chart.
# status: include | exclude | tbd
#   include -> part of the final chart, as one row ("project")
#   exclude -> deliberately out of scope (reason in `note`)
#   tbd     -> not yet decided, needs Christophe's call
#
# A group's `repos` list may span multiple owners (personal account + one or
# more orgs) -- this is expected: several projects started under cthiebaud/
# or a shared org and later grew their own dedicated org.

groups:

  # ---------------------------------------------------------------- include
  - name: parimagine
    status: include
    site: https://dev.parimagine.fr
    repos:
      - {owner: parimagine, repo: parimagine}
      - {owner: parimagine, repo: parimagine.github.io}

  - name: earthlydelights
    status: include
    site: null
    repos:
      - {owner: earthlydelights, repo: image-server}
      - {owner: earthlydelights, repo: earthlydelights.github.io}
    note: >
      Site dead (checked 2026-10-15): CNAME points to earthlydelights.garden,
      which is NXDOMAIN; github.io URL 301-redirects there too, so there's no
      live fallback either.

  - name: covid
    status: include
    site: null
    repos:
      - owner: usa-covid-aequologica-net
        repo: usa.covid.aequologica.net
        extra_refs: [origin/backup]  # 148 commits, 2020-06-18 -> 2020-12-21, confirmed real (100% his own, genuine source edits) -- disconnected history from master (no common ancestor: a from-scratch restart on 2020-12-20), not reachable via plain `git log`. This is Christophe's actual project start; "master" alone understates it by ~6 months.
      - {owner: covid-aequologica-net, repo: covid-aequologica-net.github.io}
      - {owner: covid-aequologica-net, repo: proxy}
    note: >
      Two sibling orgs (usa-covid-... and covid-...) feeding one project.
      covid-aequologica-net.github.io is a FORK (isFork=true) -- double check
      it's actually Christophe's own commits before counting it, same caution
      as the fork-exclusion heuristic used elsewhere. Site dead (checked
      2026-10-15): CNAME points to covid.aequologica.net, which is NXDOMAIN;
      same for usa.covid.aequologica.net.

  - name: sangiosleague
    status: include
    site: null
    repos:
      - {owner: sangiosleague, repo: sangiosleague.github.io}
      - {owner: sangiosleague, repo: sangiosleague.api}
    note: >
      Site dead (checked 2026-10-15): github.io URL 301-redirects to
      sangiosleague.it, which is NXDOMAIN.

  - name: sangiovannilipioni
    status: include
    site: null
    repos:
      - owner: sangiovannilipioni
        repo: sangiovannilipioni.github.io
        extra_refs: [origin/nuxt3]  # 1 commit, "try nuxt3£" -- trivial, included for completeness
      - {owner: sangiovannilipioni, repo: sangiovannilipioni.api}
    note: >
      sangiovannilipioni.net (the CNAME still configured in the repo, and
      still resolving -- GitHub's Pages API and DNS alone both suggested it
      was live) was taken over by another team and now serves a different,
      unrelated project (confirmed by Christophe 2026-10-15). Do not link to
      it, despite it technically responding.

  - name: ciaccona
    status: include
    site: https://ciaccona.cthiebaud.com
    repos:
      - owner: cthiebaud
        repo: ciaccona
        extra_refs: [origin/dev, origin/dev2]  # 3 + 13 real commits, Apr/May 2023, never merged into main (origin/gh-pages also exists but is confirmed build output -- deploy-script commits renaming hashed .mjs bundles, manifest.json, CNAME shuffling -- NOT included)
      - {owner: musicollator, repo: ciaccona}
      - {owner: musicollator, repo: ciaccona-stationary}
      - {owner: cthiebaud, repo: sheet-music}
    note: "ciaccona-stationary contributes commits/days but ~0 LOC (confirmed no code)."

  - name: bookshelves
    status: include
    site: https://bookshelves.cthiebaud.com
    repos:
      - {owner: cthiebaud, repo: bookshelves}
      - {owner: cthiebaud, repo: bookcovers}

  - name: aletheia
    status: include
    site: https://aletheia.cthiebaud.com
    repos:
      - owner: cthiebaud
        repo: truth
        extra_refs: [origin/production]  # 1 commit, trivial deployment-tracking edit, included for completeness
      - {owner: cthiebaud, repo: truth-reservoir}
    note: "\"aletheia\" (Greek for \"truth\") == cthiebaud/truth + cthiebaud/truth-reservoir (archived predecessor)."

  - name: bwv
    status: include
    site: https://bwv.cthiebaud.com
    repos:
      - {owner: cthiebaud, repo: bwv543}      # archived, explicit fold-in per PROMPT.md
      - {owner: cthiebaud, repo: bwv849}
      - {owner: cthiebaud, repo: bwv1006}     # archived
      - {owner: cthiebaud, repo: bwv-zeug}    # archived
      - {owner: cthiebaud, repo: bwv}         # archived
      - {owner: musicollator, repo: bwv}
      - {owner: musicollator, repo: bwv543}
      - {owner: musicollator, repo: bwv1006}
      - {owner: musicollator, repo: bwv245}
      - {owner: musicollator, repo: bwv639}
      - {owner: musicollator, repo: bwv659}
      - {owner: musicollator, repo: bwv846}
      - {owner: musicollator, repo: bwv849}
      - {owner: musicollator, repo: bwv988}
      - {owner: musicollator, repo: bwv-siegel}
    note: >
      PROMPT.md only names bwv543 explicitly, but there are clearly many more
      BWV-numbered repos (one per piece?) across cthiebaud/ and musicollator/.
      ASSUMPTION: all of these merge into the single "bwv" chart row, same as
      ciaccona's multi-repo merge. Please confirm this is intentional and the
      list above is complete (vs. splitting some out as their own projects).

  - name: mundial
    status: include
    site: https://mundial.cthiebaud.com
    repos:
      - {owner: born-in-plays-for, repo: mundial}
      - {owner: born-in-plays-for, repo: mundial-build}
      - {owner: born-in-plays-for, repo: mundial-data}
      - {owner: born-in-plays-for, repo: mundial-server}
    note: >
      born-in-plays-for/.github is org-metadata, not a project repo --
      omitted. GitHub's Pages API reports the site's last build as
      status=errored (checked 2026-10-15) -- the site still serves fine
      (the previous successful build stays live), but worth knowing a more
      recent deploy attempt broke.

  - name: gear
    status: include
    site: https://gear.cthiebaud.com
    repos:
      - owner: cthiebaud
        repo: gear
        extra_refs: [origin/freeform-layout]  # 4 real commits, 2026-09-02/03, never merged into main (sound-file renames, free-node behavior, favicon set)

  - name: klam
    status: include
    site: https://klam.cthiebaud.com
    repos:
      - {owner: cthiebaud, repo: klam}
    note: >
      REVERSES PROMPT.md's prior exclusion ("too tiny") -- confirmed
      2026-10-15, after the chart moved to one row per burst instead of one
      row per whole project: "too tiny" was a whole-project verdict, but
      klam's one burst (56.2 active days, 41 commits -- "Musique de
      Christophe Thiebaud", 100% his own authorship) is bigger than the
      smallest burst already in the chart (ciaccona4: 27.2 days, 24
      commits). Christophe confirmed via AskUserQuestion.

  - name: openmozart
    status: include
    site: https://openmozart.cthiebaud.com
    repos:
      - {owner: cthiebaud, repo: openmozart.net}
    note: >
      REVERSES PROMPT.md's prior exclusion ("too tiny") -- confirmed
      2026-10-15, same reasoning as klam above: "in memoriam openmozart.net,
      2001-2005", 100% his own authorship, one burst of 21.2 active days /
      263 commits / 12.4 commits-per-day -- more intense than almost
      everything else already in the chart. Christophe confirmed via
      AskUserQuestion. (openricard, also investigated at the same time, had
      an even more intense burst -- 9.7 days / 264 commits / 27.1/day -- but
      was NOT added: Christophe did not select it, leaving its "joke
      project" exclusion in place despite the burst intensity. Don't re-add
      without asking again.)

  # ---------------------------------------------------------------- exclude
  - name: iroif
    status: exclude
    repos: [{owner: cthiebaud, repo: iroif}]
    note: "infrastructure/meta, not a true project (per PROMPT.md)."

  - name: aequologica
    status: exclude
    repos:
      - {owner: aequologica, repo: aequologica.github.io}
      - {owner: aequologica, repo: deputes-scraper}
      - {owner: aequologica, repo: reveal.js}
    note: "infrastructure/meta (per PROMPT.md). reveal.js is also a fork."

  - name: cthiebaud.github.io
    status: exclude
    repos: [{owner: cthiebaud, repo: cthiebaud.github.io}]
    note: "infrastructure/meta (per PROMPT.md)."

  - name: openricard
    status: exclude
    repos: [{owner: cthiebaud, repo: openricard.net}]
    note: >
      joke project (per PROMPT.md). Re-investigated 2026-10-15 alongside
      klam/openmozart under the burst model: has the single most intense
      burst found of any excluded repo (9.7 days, 264 commits, 27.1
      commits/day -- higher than mundial's 25.97), 100% his own authorship,
      "718 permutations of the word RICARD." Christophe did NOT select it
      for inclusion despite the burst intensity -- the "joke project"
      verdict stands. Don't re-add without asking again.

  - name: emugnier
    status: exclude
    repos: [{owner: cthiebaud, repo: emugnier}]
    note: >
      Originally recorded as "too tiny; also a fork" -- WRONG, corrected
      2026-10-15: re-investigated under the burst model and found a real,
      substantial burst (262.4 active days, 308 commits, 100% his own
      authorship despite the fork flag). The actual reason to exclude it:
      it's the "Mugnier & Thiebaud" joint site (CNAME -> mugnierandthiebaud.com,
      README literally titled "Mugnier & Thiebaud") -- the same site already
      investigated and excluded under the mugnierandthiebaud org. Size was
      never the real issue here.

  - name: music
    status: include
    site: https://music.cthiebaud.com
    repos:
      - {owner: cthiebaud, repo: music}
      - owner: cthiebaud
        repo: vinyl
        extra_refs: [origin/no_color_no_font]  # 58 real commits, 2024-01-13 -> 2026-09-27, never merged into main -- confirmed genuine hand-written feature work (body.html, src/js/_View.js/_Model.js, real messages like "re-introduced facebook videos"), not build output
    note: >
      REVERSES PROMPT.md's prior exclusion ("too tiny") -- Christophe
      confirmed (2026-10-15) that merging in vinyl gives it enough scope to
      count as a project. (Superseded by klam/openmozart's additions the
      same day -- see the include-section entries above for the current
      count.)

  - name: hat
    status: exclude
    repos: []
    note: >
      Professional assignment, not hobby work (per PROMPT.md). Not found in
      this inventory at all (not owned by cthiebaud or any of his orgs) --
      presumably lives under an employer/client org he isn't a member of, or
      was named differently. No action needed since it's excluded anyway.

  - name: athenaeum
    status: include
    site: null
    repos:
      - {owner: athenaeum-brew, repo: password-validator}
      - {owner: athenaeum-brew, repo: password-validator-acceptance}
      - {owner: athenaeum-brew, repo: password-validator-impl}
      - {owner: athenaeum-brew, repo: questioneer}
      - {owner: cthiebaud, repo: mythos}
    note: >
      Re-added 2026-10-15, reversing the earlier "professional course, not
      hobby" exclusion -- Christophe's direct call. Scoped to 5 of the
      original 17 repos: the password-validator trio (impl + its own tests
      + acceptance tests), questioneer (site now dead -- see Deployment
      notes, dangling DNS already removed), and mythos (owned by cthiebaud,
      not athenaeum-brew, but confirmed part of the same course effort).
      The other 12 athenaeum-brew repos (making-of, einfuehrung, maven-repo,
      concurrent-examples, webapp-examples, javafx-examples,
      javafx-webview-example, yaml-example, console-example, oop-example,
      generics-example) and cthiebaud/repository are deliberately left out
      -- generic course-exercise scaffolding, not this specific effort.
      A sixth candidate, "model", turned out to be a small local-only subset
      of mythos never pushed to git (same unreachable-local-copy situation
      as "hat") -- correctly has no git history to compute from, ignored.
      Language scope note: this is the first Java-heavy project in the
      chart -- the LOC/netLoc pipeline counts whatever cloc recognizes
      (JS/HTML/CSS/Java/Python/etc., minus content formats), not a
      JS-specific allowlist, so Java is included like any other real
      language once manual_excludes.py is checked for vendored dependencies
      (Maven projects commonly commit vendored jars/libs).

  # -------------------------------------------------------------------- tbd
