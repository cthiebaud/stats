  - name: hacklily
    status: exclude
    repos: [{owner: cthiebaud, repo: hacklily}]
    note: "Fork of 3rd-party code. Recommend: exclude."
  - name: PasswordValidator
    status: exclude
    repos: [{owner: cthiebaud, repo: PasswordValidator}]
    note: "Fork, archived. Likely a personal copy of the athenaeum-brew course exercise. Recommend: exclude."
  - name: password_validator
    status: exclude
    repos: [{owner: cthiebaud, repo: password_validator}]
    note: "Fork, archived. Same as above -- likely a duplicate/variant. Recommend: exclude."
  - name: Cryptique
    status: exclude
    repos: [{owner: cthiebaud, repo: Cryptique}]
    note: "Fork, archived. Recommend: exclude."
  - name: idontknow
    status: exclude
    repos: [{owner: cthiebaud, repo: idontknow}]
    note: "Fork, archived. Recommend: exclude."
  - name: MutopiaProject
    status: exclude
    repos: [{owner: cthiebaud, repo: MutopiaProject}]
    note: "Fork, archived. Recommend: exclude."
  - name: element-plus-nuxt-starter
    status: exclude
    repos: [{owner: cthiebaud, repo: element-plus-nuxt-starter}]
    note: "Fork, archived, boilerplate starter template. Recommend: exclude."
  - name: HTTP-Proxy-Servlet
    status: exclude
    repos: [{owner: cthiebaud, repo: HTTP-Proxy-Servlet}]
    note: "Fork, archived, utility library. Recommend: exclude."
  - name: reveal.js (personal fork)
    status: exclude
    repos: [{owner: cthiebaud, repo: reveal.js}]
